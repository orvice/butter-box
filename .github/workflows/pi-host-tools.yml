name: Pi host tools

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi: [1.2.0, 1.3.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/pi/hostextension/package-lock.json
      - name: Typecheck trusted extension
        run: |
          npm ci --prefix internal/pi/hostextension --ignore-scripts
          npm run --prefix internal/pi/hostextension typecheck
      - name: Go build and regression tests
        run: |
          go build ./...
          go test -race ./...
      - name: Install pinned Pi runtime
        env:
          PI_VERSION: ${{ matrix.pi }}
        run: npm install --prefix "$RUNNER_TEMP/pi-runtime" --ignore-scripts --no-audit --no-fund "@earendil-works/pi-coding-agent@$PI_VERSION"
      - name: Deterministic Pi extension and fake Butter integration
        env:
          BUTTERBOX_PI_SMOKE: "1"
          BUTTERBOX_PI_SMOKE_BIN: ${{ runner.temp }}/pi-runtime/node_modules/.bin/pi
        run: go test -race ./internal/pi -run '^TestRealPiHostRelay' -count=1 -v
