syntax = "proto3";

package butterbox.pi.v1;

option go_package = "github.com/orvice/butter-box/pkg/proto/butterbox/pi/v1;piv1";

// PiService drives pi coding-agent sessions hosted on this ButterBox.
//
// A session maps 1:1 to a `pi --mode rpc` child process while active. Session
// IDs are pi's own session IDs; session data lives in pi's session directory
// (~/.pi/agent), so an inactive session can be re-attached transparently and
// every session is visible in pi-web.
service PiService {
  // CreateSession spawns a new pi session process.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);

  // ListSessions reports sessions currently held by this server (active
  // processes only; historical sessions live in pi's session directory).
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // GetSession reports state and usage statistics for one session,
  // re-attaching it if it is not currently active.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);

  // SendMessage sends one prompt and returns after the run fully settles
  // (pi's agent_settled: no pending retry, compaction, or queued follow-up).
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);

  // StreamMessage sends one prompt and streams raw pi events until the run
  // settles. The final message has type "agent_settled".
  rpc StreamMessage(StreamMessageRequest) returns (stream StreamMessageResponse);

  // SubmitMessage accepts one prompt and returns immediately with a turn
  // cursor. The run is detached from the request lifetime: a dropped
  // connection never aborts it. Poll or long-poll the run with GetTurn;
  // AbortSession is the only way to cancel it.
  rpc SubmitMessage(SubmitMessageRequest) returns (SubmitMessageResponse);

  // GetTurn reports whether the run submitted at turn_cursor is still in
  // flight, optionally waiting for it to settle, and returns its result once
  // the session entries past the cursor contain an assistant message.
  rpc GetTurn(GetTurnRequest) returns (GetTurnResponse);

  // GetAvailableModels reports the models pi can use on this box (as
  // configured by pi's providers/auth). With session_id set it asks that
  // session's process, re-attaching it if it is not currently active; with
  // session_id empty it answers for the box itself, no session required.
  rpc GetAvailableModels(GetAvailableModelsRequest) returns (GetAvailableModelsResponse);

  // ListDirectories lists the immediate subdirectories of one directory
  // inside the box's sandbox root — enough for a working-directory picker to
  // walk down one level per call. Read-only: no file contents, no recursion.
  rpc ListDirectories(ListDirectoriesRequest) returns (ListDirectoriesResponse);

  // AbortSession aborts the in-flight run, if any.
  rpc AbortSession(AbortSessionRequest) returns (AbortSessionResponse);

  // DeleteSession stops the session process. The session file on disk is
  // kept unless purge is set.
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
}

message CreateSessionRequest {
  // Optional display name (pi session name, shown in pi-web listings).
  string name = 1;
  // Optional model provider (e.g. "anthropic"). Empty uses pi's default.
  string provider = 2;
  // Optional model pattern or ID as accepted by pi's --model flag.
  string model = 3;
  // Optional thinking level: off, minimal, low, medium, high, xhigh, max.
  string thinking_level = 4;
  // Optional working directory for the session's pi process, absolute or
  // relative to the box's sandbox root. Must resolve inside the sandbox root
  // and exist. Empty keeps the server process working directory.
  string cwd = 5;
}

message CreateSessionResponse {
  Session session = 1;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  Session session = 1;
  SessionStats stats = 2;
}

message SendMessageRequest {
  string session_id = 1;
  string message = 2;
  repeated ImageContent images = 3;
}

message SendMessageResponse {
  // Text of the last assistant message after the run settled.
  string text = 1;
  // Stop reason of the last assistant message: stop, length, toolUse,
  // error, aborted. Empty when no assistant message was produced.
  string stop_reason = 2;
  // Cumulative session statistics after the run.
  SessionStats stats = 3;
}

message StreamMessageRequest {
  string session_id = 1;
  string message = 2;
  repeated ImageContent images = 3;
}

message StreamMessageResponse {
  // pi event type (message_update, tool_execution_start, agent_settled, ...).
  string type = 1;
  // Full pi event as JSON, passed through verbatim.
  string payload_json = 2;
}

message SubmitMessageRequest {
  string session_id = 1;
  string message = 2;
  repeated ImageContent images = 3;
}

message SubmitMessageResponse {
  // pi's entries cursor at submit time: the session's leaf entry id, "" for
  // a session with no entries yet. Stable across process restarts — pass it
  // to GetTurn to await or recover this turn's result.
  string turn_cursor = 1;
}

message GetTurnRequest {
  string session_id = 1;
  // Cursor returned by SubmitMessage.
  string turn_cursor = 2;
  // 0 answers immediately (pure poll); >0 waits up to this many seconds
  // (capped at 30) for the run to settle before answering.
  int32 wait_seconds = 3;
}

message GetTurnResponse {
  // True while a run is still in flight on the session.
  bool running = 1;
  // Set when entries past turn_cursor contain an assistant message. Unset
  // with running=false means the turn did not finish (e.g. the process was
  // restarted mid-run or the turn was aborted before any assistant reply).
  TurnResult result = 2;
}

message TurnResult {
  // Text of the last assistant message produced after the turn cursor.
  string text = 1;
  // Stop reason of that assistant message: stop, length, toolUse, error,
  // aborted.
  string stop_reason = 2;
  // Cumulative session statistics.
  SessionStats stats = 3;
}

message GetAvailableModelsRequest {
  // Optional session whose pi process answers — its scoped model config may
  // differ. Empty answers from the box: a short-lived pi process reads the
  // catalog, and the result is cached for a few minutes.
  string session_id = 1;
}

message GetAvailableModelsResponse {
  repeated Model models = 1;
}

message Model {
  // Model ID as accepted by pi's --model flag and set_model (e.g.
  // "claude-fable-5").
  string id = 1;
  // Provider ID (e.g. "anthropic").
  string provider = 2;
  // Human-readable model name.
  string name = 3;
  // Wire API the model speaks (e.g. "anthropic-messages",
  // "openai-responses").
  string api = 4;
  // True when the model supports reasoning/thinking.
  bool reasoning = 5;
  // Supported input modalities: "text", "image".
  repeated string input = 6;
  int64 context_window = 7;
  int64 max_tokens = 8;
  // Cost in USD per million tokens.
  ModelCost cost = 9;
}

message ModelCost {
  double input = 1;
  double output = 2;
  double cache_read = 3;
  double cache_write = 4;
}

message ListDirectoriesRequest {
  // Directory to list, absolute or relative to the box's sandbox root. Empty
  // lists the sandbox root itself. Must resolve inside the sandbox root and
  // be an existing directory.
  string path = 1;
  // Include entries whose name starts with "." (skipped by default).
  bool include_hidden = 2;
}

message ListDirectoriesResponse {
  // Absolute path of the listed directory.
  string path = 1;
  // Immediate subdirectories, sorted by name. Symlinked directories are not
  // reported, so walking these listings never leaves the sandbox root.
  repeated Directory directories = 2;
  // True when the listing hit the server cap and is incomplete.
  bool truncated = 3;
}

message Directory {
  // Base name of the directory.
  string name = 1;
  // Absolute path, usable as CreateSession.cwd or a further ListDirectories
  // path.
  string path = 2;
}

message AbortSessionRequest {
  string session_id = 1;
}

message AbortSessionResponse {}

message DeleteSessionRequest {
  string session_id = 1;
  // Also delete the session file from pi's session directory.
  bool purge = 2;
}

message DeleteSessionResponse {}

message Session {
  // pi's session ID.
  string id = 1;
  // Display name, if set.
  string name = 2;
  // Absolute path of the session JSONL file ("" for ephemeral sessions).
  string session_file = 3;
  // Selected model as "provider/id" ("" when pi reports none).
  string model = 4;
  // True while a run is in flight.
  bool streaming = 5;
  int32 message_count = 6;
  // Effective working directory of the session process ("" when unknown).
  string cwd = 7;
}

message SessionStats {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  int64 cache_read_tokens = 3;
  int64 cache_write_tokens = 4;
  // Total session cost in USD.
  double cost = 5;
  // Current context window usage percentage (0 when unknown).
  int32 context_percent = 6;
}

message ImageContent {
  // e.g. "image/png".
  string mime_type = 1;
  // Raw image bytes.
  bytes data = 2;
}
